server {
    listen 8083;

    # El build de CRA fue generado con "homepage": "/mdm" (ver package.json),
    # por lo que todos los assets usan rutas absolutas /mdm/... El nginx
    # principal del servidor debe hacer proxy_pass de /mdm/ hacia este
    # contenedor SIN recortar el prefijo (location /mdm/ { proxy_pass
    # http://127.0.0.1:8083/mdm/; }).
    root /usr/share/nginx/html;
    index index.html;

    location /mdm/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /mdm/index.html;
    }

    location = / {
        return 301 /mdm/;
    }
}

